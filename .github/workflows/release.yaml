name: release

# Releases are cut from the GitHub UI (Actions ▸ release ▸ Run) or
# by the release train, through workflow_call's identical inputs. `plan`
# rehearses with no credential; `cut` runs in the protected `release` environment,
# the "who can publish" gate whose key only it reads, and pushes the version
# commit, the tag and the GitHub Release as the release App.
#
# The tag then runs this workflow again, and that run publishes: the image and
# its attestation, and the pin dispatch. Only the release App and admins can
# create a tag, so one approval covers the release, and a hotfix tag publishes
# its line the same way. The build tags its image from the tag ref
# (build-actions with no `version:`).
on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: Bump and report only
        required: false
        type: boolean
        default: false
  workflow_call:
    inputs:
      dry_run:
        required: false
        type: boolean
        default: false
  push:
    tags: ["v*"]

run-name: "${{ github.event_name == 'push' && format('📦 publish {0}', github.ref_name) || format('🚀 release {0}{1}', github.ref_name, inputs.dry_run && ' (dry-run)' || '') }}"

jobs:
  plan:
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      tag: ${{ steps.core.outputs.tag }}
    steps:
      - id: core
        uses: a-novel-kit/workflows/publish-actions/release-core@v1.86.0
        with:
          # renovate: datasource=go depName=github.com/a-novel-kit/stack/cli
          cli_version: "1.42.4"
          dry_run: "true"

  # GitHub's release-notes endpoint wants contents write although it stores nothing, so this job
  # holds that token alone and runs no repository code. `cut` waits for it, so whoever approves the
  # cut has read the notes.
  notes:
    needs: [plan]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Preview the release notes
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.plan.outputs.tag }}
        run: |
          gh api --method POST "repos/$GITHUB_REPOSITORY/releases/generate-notes" \
            -f tag_name="$TAG" -f target_commitish="$GITHUB_SHA" \
            --jq .body >> "$GITHUB_STEP_SUMMARY"

  cut:
    needs: [plan, notes]
    if: github.event_name != 'push' && !inputs.dry_run
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
    steps:
      - uses: a-novel-kit/workflows/publish-actions/release-core@v1.86.0
        with:
          # renovate: datasource=go depName=github.com/a-novel-kit/stack/cli
          cli_version: "1.42.4"
          client_id: ${{ vars.RELEASE_BOT_CLIENT_ID }}
          app_private_key: ${{ secrets.RELEASE_BOT_PRIVATE_KEY }}

  build-platform:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    # The source-map upload key is a secret of the sourcemaps environment, which no feature branch
    # opens. A platform without one uploads nothing.
    environment:
      name: sourcemaps
      deployment: false
    permissions:
      attestations: write
      contents: read
      id-token: write
      packages: write
    steps:
      - uses: a-novel-kit/workflows/build-actions/docker@v1.86.0
        with:
          file: Dockerfile
          image_name: ${{ github.repository }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          # BuildKit leaves secrets out of cache keys, so master's cached build of the same tree would
          # skip the upload.
          cache: "false"
          secrets: |
            npm_token=${{ secrets.GITHUB_TOKEN }}
            faro_sourcemap_api_key=${{ secrets.FARO_SOURCEMAP_API_KEY }}
            faro_sourcemap_app_id=${{ vars.FARO_SOURCEMAP_APP_ID }}

  # Infra pins the published images in one pull request, which deploys the release once it merges.
  deploy:
    needs: [build-platform]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    # The Agent key is a secret of the governance environment, which no feature branch opens.
    environment:
      name: governance
      deployment: false
    permissions: {}
    steps:
      - uses: a-novel-kit/workflows/publish-actions/deploy-release@v1.86.0
        with:
          client_id: ${{ vars.AGENT_BOT_CLIENT_ID }}
          app_private_key: ${{ secrets.AGENT_BOT_PRIVATE_KEY }}
          version: ${{ github.ref_name }}

  archive:
    needs: [build-platform]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    # The Agent key is a secret of the governance environment, which no feature branch opens.
    environment:
      name: governance
      deployment: false
    permissions:
      contents: read
    steps:
      - uses: a-novel-kit/workflows/generic-actions/archive-board-items@v1.86.0
        with:
          client_id: ${{ vars.AGENT_BOT_CLIENT_ID }}
          app_private_key: ${{ secrets.AGENT_BOT_PRIVATE_KEY }}
          project_id: ${{ github.repository_owner == 'a-novel' && 'PVT_kwDOB9MxdM4BMh8r' || 'PVT_kwDOCy-nAM4BbtKH' }}
