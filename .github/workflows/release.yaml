name: release

# Releases are cut from the GitHub UI (Actions ▸ release ▸ pick a type ▸ Run) or
# by the release train, through workflow_call's identical inputs. `plan`
# rehearses with no credential; `cut` runs in the protected `release` environment,
# the "who can publish" gate whose key only it reads, and pushes the version
# commit, the tag and the GitHub Release as the release App.
#
# The tag then runs this workflow again, and that run publishes: the image and
# its attestation, and the pin dispatch. Only the release App and admins can
# create a tag, so one approval covers the release, and a hotfix tag publishes
# its line the same way. The build tags its image from the tag ref
# (build-actions with no `version:`).
on:
  workflow_dispatch:
    inputs:
      release_type:
        description: Version bump to cut
        required: true
        type: choice
        options:
          - patch
          - minor
          - major
      dry_run:
        description: Bump and report only
        required: false
        type: boolean
        default: false
  workflow_call:
    inputs:
      release_type:
        required: true
        type: string
      dry_run:
        required: false
        type: boolean
        default: false
  push:
    tags: ["v*"]

run-name: "${{ github.event_name == 'push' && format('📦 publish {0}', github.ref_name) || format('🚀 release {0}{1}', inputs.release_type, inputs.dry_run && ' (dry-run)' || '') }}"

jobs:
  plan:
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: a-novel-kit/workflows/publish-actions/release-core@v1.70.0
        with:
          # renovate: datasource=go depName=github.com/a-novel-kit/stack/cli
          cli_version: "1.9.1"
          release_type: ${{ inputs.release_type }}
          dry_run: "true"

  cut:
    needs: [plan]
    if: github.event_name != 'push' && !inputs.dry_run
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
    steps:
      - uses: a-novel-kit/workflows/publish-actions/release-core@v1.70.0
        with:
          # renovate: datasource=go depName=github.com/a-novel-kit/stack/cli
          cli_version: "1.9.1"
          release_type: ${{ inputs.release_type }}
          client_id: ${{ vars.RELEASE_BOT_CLIENT_ID }}
          app_private_key: ${{ secrets.RELEASE_BOT_PRIVATE_KEY }}

  build-platform:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      attestations: write
      contents: read
      id-token: write
      packages: write
    steps:
      - uses: a-novel-kit/workflows/build-actions/docker@v1.70.0
        with:
          file: Dockerfile
          image_name: ${{ github.repository }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          secrets: |
            npm_token=${{ secrets.GITHUB_TOKEN }}

  # Infra pins the published images in one pull request, which deploys the release once it merges.
  deploy:
    needs: [build-platform]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    # The Agent key is a secret of the governance environment, which no feature branch opens.
    environment:
      name: governance
      deployment: false
    permissions: {}
    steps:
      - uses: a-novel-kit/workflows/publish-actions/deploy-release@v1.70.0
        with:
          client_id: ${{ vars.AGENT_BOT_CLIENT_ID }}
          app_private_key: ${{ secrets.AGENT_BOT_PRIVATE_KEY }}
          version: ${{ github.ref_name }}

  archive:
    needs: [build-platform]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    # The Agent key is a secret of the governance environment, which no feature branch opens.
    environment:
      name: governance
      deployment: false
    permissions:
      contents: read
    steps:
      - uses: a-novel-kit/workflows/generic-actions/archive-board-items@v1.70.0
        with:
          client_id: ${{ vars.AGENT_BOT_CLIENT_ID }}
          app_private_key: ${{ secrets.AGENT_BOT_PRIVATE_KEY }}
