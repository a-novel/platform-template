name: translations

on: # zizmor: ignore[dangerous-triggers] Reads labels and reruns a check; never checks out or runs PR code.
  pull_request_target:
    types: [labeled, unlabeled, synchronize]

permissions: {}

jobs:
  approval:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: translations-${{ github.event.pull_request.number }}
      cancel-in-progress: false
    permissions:
      actions: write
      contents: read
      pull-requests: write
    steps:
      - uses: a-novel-kit/workflows/generic-actions/approve-translations@v1.63.0
        with:
          github_token: ${{ github.token }}
