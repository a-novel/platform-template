# The platform's gitleaks config. gitleaks cannot layer configs, so this file replaces the
# scan-secrets baseline wholesale and keeps only the allowlists the platform's files need.
#
# Every allowlist targets `generic-api-key` alone — the entropy heuristic. The
# provider-specific rules (AWS, GitHub, Stripe, ...) stay active everywhere,
# including in tests, because a real cloud credential is never acceptable there.

[extend]
useDefault = true

[[allowlists]]
description = "The lockfile: package integrity digests are high-entropy by construction."
targetRules = ["generic-api-key"]
paths = ['''(^|/)pnpm-lock\.yaml$''']

[[allowlists]]
description = "The e2e compose file: throwaway credentials for a database that lives for one run."
targetRules = ["generic-api-key"]
regexes = [
  '''postgres://postgres:postgres@''',
]

[[allowlists]]
description = "The fixed local-development master key of the disposable authentication service in builds/compose.e2e.yaml, matched by value so any other high-entropy string is still reported."
targetRules = ["generic-api-key"]
regexes = ['''fec0681a2f57242211c559ca347721766f8a3acd8ed2e63b36b3768051c702ca''']
