name: template-e2e

x-postgres-environment: &postgres-environment
  POSTGRES_PASSWORD: postgres
  POSTGRES_USER: postgres
  POSTGRES_DB: postgres
  POSTGRES_HOST_AUTH_METHOD: scram-sha-256
  POSTGRES_INITDB_ARGS: --auth=scram-sha-256

x-postgres-healthcheck: &postgres-healthcheck
  test: ["CMD", "pg_isready", "-U", "postgres"]
  interval: 1s
  timeout: 5s
  retries: 30

services:
  postgres-authentication:
    image: ghcr.io/a-novel/service-authentication/database:v2.15.3@sha256:6e8aab13a3f8a3cff10c39f87d8d50a3153dabe88d7da3b20786079239f68ae1
    environment: *postgres-environment
    healthcheck: *postgres-healthcheck

  postgres-json-keys:
    image: ghcr.io/a-novel/service-json-keys/database:v2.13.0@sha256:8778711f5c9beb691b741b2edbbcccf4e5f857b0ff3380fbf2210dea194aab5a
    environment: *postgres-environment
    healthcheck: *postgres-healthcheck

  mailserver:
    image: ghcr.io/axllent/mailpit:v1.32.0
    ports:
      - "127.0.0.1:14825:8025"
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: "true"
      MP_SMTP_AUTH_ALLOW_INSECURE: "true"
      MP_DISABLE_WAL: "true"

  service-json-keys:
    image: ghcr.io/a-novel/service-json-keys/standalone-grpc:v2.12.3@sha256:f4095d2c1164725dc9b55fd6204025def2f23608ec4dff510831cfb9ebdf079a
    healthcheck:
      test: ["CMD", "grpcurl", "--plaintext", "-d", "", "localhost:8080", "grpc.health.v1.Health/Check"]
      interval: 1s
      timeout: 5s
      retries: 30
    depends_on:
      postgres-json-keys:
        condition: service_healthy
    environment:
      POSTGRES_HOST: postgres-json-keys
      POSTGRES_PORT: 5432
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DATABASE: postgres
      POSTGRES_TLS_ENABLED: "false"
      APP_MASTER_KEY: fec0681a2f57242211c559ca347721766f8a3acd8ed2e63b36b3768051c702ca

  authentication:
    image: ghcr.io/a-novel/service-authentication/standalone-rest:v2.15.3@sha256:176b519e8991a1503b38c9925f98ef4d14b3add3fe16cf75efba99b144ada710
    ports:
      - "127.0.0.1:14100:8080"
    healthcheck:
      test: ["CMD", "wget", "-qO", "/dev/null", "http://localhost:8080/v2/ping"]
      interval: 1s
      timeout: 5s
      retries: 30
    depends_on:
      postgres-authentication:
        condition: service_healthy
      service-json-keys:
        condition: service_healthy
      mailserver:
        condition: service_started
    command:
      - sh
      - -c
      - >-
        /migrations &&
        /maintenance account-role --email admin@template.test --role auth:superadmin --lang en &&
        exec /rest
    environment:
      POSTGRES_HOST: postgres-authentication
      POSTGRES_PORT: 5432
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DATABASE: postgres
      POSTGRES_TLS_ENABLED: "false"
      SERVICE_JSON_KEYS_HOST: service-json-keys
      SERVICE_JSON_KEYS_PORT: 8080
      PLATFORM_AUTH_URL: http://127.0.0.1:4173
      SMTP_SENDER_DOMAIN: mailserver
      SMTP_ADDR: mailserver:1025
      SMTP_SENDER_NAME: Template integration tests
      SMTP_SENDER_EMAIL: noreply@template.test
      SMTP_SENDER_PASSWORD: test-only
      SMTP_FORCE_UNENCRYPTED: "true"
      # Every journey comes from one address and mints its own anonymous session.
      REST_RATE_LIMITS_ENABLED: "false"
