name: template-e2e

x-postgres-environment: &postgres-environment
  POSTGRES_PASSWORD: postgres
  POSTGRES_USER: postgres
  POSTGRES_DB: postgres
  POSTGRES_HOST_AUTH_METHOD: scram-sha-256
  POSTGRES_INITDB_ARGS: --auth=scram-sha-256

# Stands in for the cluster's service-account issuer, so Authentication tells its callers apart as in production.
x-service-token-issuer: &service-token-issuer http://service-token-issuer:8080

x-postgres-healthcheck: &postgres-healthcheck
  test: ["CMD", "pg_isready", "-U", "postgres"]
  interval: 1s
  timeout: 5s
  retries: 30

services:
  postgres-authentication:
    image: ghcr.io/a-novel/service-authentication/database:v2.25.3@sha256:e49463997f86041d1e146c6060cc19ab37992ea7ef929627584db6ff16832ffa
    environment: *postgres-environment
    healthcheck: *postgres-healthcheck

  postgres-json-keys:
    image: ghcr.io/a-novel/service-json-keys/database:v2.15.7@sha256:06457d216da6416e58262893731c6caf4382d74e89baa13aa79eaffd629c771c
    environment: *postgres-environment
    healthcheck: *postgres-healthcheck

  mailserver:
    image: ghcr.io/axllent/mailpit:v1.33.0
    ports:
      - "127.0.0.1:14825:8025"
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: "true"
      MP_SMTP_AUTH_ALLOW_INSECURE: "true"
      MP_DISABLE_WAL: "true"

  service-json-keys:
    image: ghcr.io/a-novel/service-json-keys/standalone-grpc:v2.15.7@sha256:1078a75cbf3d691f450328f40e57d0a9a5c7a7d13b96c176d7ebe41a61ca0fc3
    healthcheck:
      test: ["CMD", "grpcurl", "--plaintext", "-d", "", "localhost:8080", "grpc.health.v1.Health/Check"]
      interval: 1s
      timeout: 5s
      retries: 30
    depends_on:
      postgres-json-keys:
        condition: service_healthy
    environment:
      POSTGRES_HOST: postgres-json-keys
      POSTGRES_PORT: 5432
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DATABASE: postgres
      POSTGRES_TLS_ENABLED: "false"
      APP_MASTER_KEY: fec0681a2f57242211c559ca347721766f8a3acd8ed2e63b36b3768051c702ca

  # JSON keys' public API, whose keys verify access tokens on the platform.
  json-keys-rest:
    image: ghcr.io/a-novel/service-json-keys/rest:v2.15.7@sha256:e93412c2570837c87cd39fff15589ce25abad11b89268213d680aabc44bef4a1
    ports:
      - "127.0.0.1:14103:8080"
    # The gRPC server's start migrates the database and creates the keys this server lists.
    depends_on:
      service-json-keys:
        condition: service_healthy
    # Podman ignores the image's own check, so the journeys' wait needs this one.
    healthcheck:
      test: ["CMD", "wget", "-qO", "/dev/null", "http://localhost:8080/v2/ping"]
      interval: 1s
      timeout: 5s
      retries: 30
    environment:
      POSTGRES_HOST: postgres-json-keys
      POSTGRES_PORT: 5432
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DATABASE: postgres
      POSTGRES_TLS_ENABLED: "false"

  service-token-issuer:
    image: ghcr.io/a-novel/service-authentication/service-token-issuer:v2.25.3@sha256:17e1b47ae6501a1f541f87ae1d74409126da70280b2143fd245c7bbdd474b0d8
    ports:
      - "127.0.0.1:14101:8080"
    environment:
      SERVICE_TOKEN_ISSUER: *service-token-issuer
    # Podman ignores the image's own check, so the wait of authentication needs this one.
    healthcheck:
      test: ["CMD", "wget", "-qO", "/dev/null", "http://localhost:8080/.well-known/openid-configuration"]
      interval: 1s
      timeout: 5s
      retries: 30

  # Holds the network authentication joins, so the outage journey's restart leaves the host's
  # interfaces alone. A new interface makes Chromium abort loading pages with ERR_NETWORK_CHANGED.
  authentication-network:
    image: registry.k8s.io/pause:3.10.2
    ports:
      - "127.0.0.1:14100:8080"

  authentication:
    image: ghcr.io/a-novel/service-authentication/standalone-rest:v2.25.3@sha256:03fdb94efc9d8adef331da74accbe8ee1f3c613a2b6e25e893b68f7ba0800dc9
    network_mode: service:authentication-network
    healthcheck:
      test: ["CMD", "wget", "-qO", "/dev/null", "http://localhost:8080/v2/ping"]
      interval: 1s
      timeout: 5s
      retries: 30
    depends_on:
      postgres-authentication:
        condition: service_healthy
      service-json-keys:
        condition: service_healthy
      mailserver:
        condition: service_started
      service-token-issuer:
        condition: service_healthy
    command:
      - sh
      - -c
      - >-
        /migrations &&
        /maintenance account-role --email admin@template.test --role auth:superadmin --lang en &&
        exec /rest
    environment:
      POSTGRES_HOST: postgres-authentication
      POSTGRES_PORT: 5432
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DATABASE: postgres
      POSTGRES_TLS_ENABLED: "false"
      SERVICE_JSON_KEYS_HOST: service-json-keys
      SERVICE_JSON_KEYS_PORT: 8080
      # Email links open the account platform, which serves every account form.
      PLATFORM_AUTH_URL: http://127.0.0.1:14102
      SMTP_SENDER_DOMAIN: mailserver
      SMTP_ADDR: mailserver:1025
      SMTP_SENDER_NAME: Template integration tests
      SMTP_SENDER_EMAIL: noreply@template.test
      SMTP_SENDER_PASSWORD: test-only
      SMTP_FORCE_UNENCRYPTED: "true"
      # Every journey comes from one address and mints its own anonymous session.
      REST_RATE_LIMITS_ENABLED: "false"
      SERVICE_TOKEN_ISSUER: *service-token-issuer
      SERVICE_TOKEN_AUDIENCE: authentication
      SERVICE_TOKEN_CALLERS: system:serviceaccount:account:web,system:serviceaccount:template:web
      # The platform as production registers it, on the address of the journeys' platform server.
      OAUTH_CLIENTS: >-
        {"template": {"redirectURI": "http://127.0.0.1:4173/auth/callback",
        "caller": "system:serviceaccount:template:web"}}

  # The account platform, where the platform signs people in.
  account:
    image: ghcr.io/a-novel/platform-account:v1.7.0@sha256:737aff012df59dc7d262dff9a9529f598433c33d5dfdd97a3647cb1d50aef7d2
    ports:
      - "127.0.0.1:14102:3000"
    depends_on:
      authentication:
        condition: service_healthy
    # The platform reads its service token from a file, as a pod reads its projected token. A token
    # lasts an hour, longer than a run.
    command:
      - sh
      - -c
      - >-
        wget -qO /tmp/service-token
        "http://service-token-issuer:8080/token?subject=system:serviceaccount:account:web&audience=authentication" &&
        exec node build
    # Podman ignores the image's own check, so the journeys' wait needs this one.
    healthcheck:
      test: ["CMD", "wget", "-qO", "/dev/null", "http://127.0.0.1:3000/ping"]
      interval: 1s
      timeout: 5s
      retries: 30
    environment:
      AUTHENTICATION_SERVICE_URL: http://authentication-network:8080
      JSON_KEYS_SERVICE_URL: http://json-keys-rest:8080
      # No profile service runs here: the discard port refuses at once, and the account platform
      # names the visitor by their email handle with initials.
      PROFILE_SERVICE_URL: http://127.0.0.1:9
      SERVICE_TOKEN_PATH: /tmp/service-token
      # The platform derives its origin, which its form posts and its issuer use, from each request,
      # over https unless this header names another protocol. The journeys' browser sends it.
      PROTOCOL_HEADER: x-forwarded-proto
      # The account platform's app list links Studio, which the journeys never open.
      STUDIO_URL: http://studio.invalid
      # The issuer answers 404 at once, which the platform reads as no planned downtime.
      DOWNTIME_URL: http://service-token-issuer:8080/downtime.json
