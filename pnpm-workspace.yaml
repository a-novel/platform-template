packages:
  - "."

autoInstallPeers: false
engineStrict: true
saveExact: true
strictPeerDependencies: false

allowBuilds:
  "@swc/core": true
  esbuild: true

minimumReleaseAgeExclude:
  - "@a-novel-kit/*"
  - "@a-novel/*"
overrides:
  glob@>=9.0.0 <=14.0.1: 14.0.2
  minimatch@>=7.0.0 <11.0.1: 11.0.1

audit:
  ignore:
    # FIXME: CVE-2026-112366 / GHSA-fc5q-39xc-vjpf (picomatch <=4.0.7, ReDoS through repeated
    # extglobs) has no patched version: the upstream fixes micromatch/picomatch#194, #238 and #246 are
    # unmerged, Snyk revoked its entry, and a dispute to withdraw it was filed on 2026-11-17. picomatch
    # reaches this platform only through build tooling (svelte-check > fdir, vite > tinyglobby), never
    # user input. Remove this entry once a patched picomatch ships (and bump it) or the advisory is
    # withdrawn. Tracking: https://github.com/micromatch/picomatch/issues/247
    - GHSA-fc5q-39xc-vjpf
